---
defaults:
  kernel_flavor: main
  version: 44
  akmods_target: common

# ZFS defaults can be overridden per kernel flavor without affecting the build matrix.
zfs:
  default:
    minor_version: "2.4"
    linux_experimental: false
  # Fork customization: the Fedora `main` kernel (7.1.x on F44) is ahead of the
  # maximum kernel OpenZFS 2.4.3 will configure against (7.0), so the ZFS akmod
  # for this flavor needs --enable-linux-experimental the same way coreos-testing
  # does. Without it `main` zfs builds fail at configure.
  main:
    minor_version: "2.4"
    linux_experimental: true
  coreos-testing:
    minor_version: "2.4"
    linux_experimental: true

arch-arm-x86: &arch-arm-x86
  architecture:
    - aarch64
    - x86_64

arch-only-x86: &arch-only-x86
  architecture:
    - x86_64

akmods-base: &akmods-base
  # Fork customization: publish into this fork's own GHCR namespace. Upstream
  # uses `ublue-os`; a fork pushing there gets a 403 from the registry.
  org: danathar
  registry: ghcr.io
  repo: akmods
  transport: docker://

akmods-common: &akmods-common
  name: akmods
  description: "A caching layer for pre-built akmod RPMs"

akmods-nvidia-lts: &akmods-nvidia-lts
  name: akmods-nvidia-lts
  description: "A caching layer for the pre-built nvidia-lts akmod RPMs"

akmods-nvidia-open: &akmods-nvidia-open
  name: akmods-nvidia-open
  description: "A caching layer for the pre-built nvidia-open akmod RPMs"

akmods-zfs: &akmods-zfs
  name: akmods-zfs
  description: "A caching layer for the pre-built zfs akmod RPMs"

akmods-extra: &akmods-extra
  name: akmods-extra
  description: "A caching layer for pre-built extra akmod RPMs"

desktop-build-group-only-x86: &desktop-build-group-only-x86
  common:
    !!merge <<:
      - *akmods-base
      - *akmods-common
      - *arch-only-x86
  nvidia-lts:
    !!merge <<:
      - *akmods-base
      - *akmods-nvidia-lts
      - *arch-only-x86
  nvidia-open:
    !!merge <<:
      - *akmods-base
      - *akmods-nvidia-open
      - *arch-only-x86

ogc-desktop-build-group-only-x86: &ogc-desktop-build-group-only-x86
  common:
    !!merge <<:
      - *akmods-base
      - *akmods-common
      - *arch-only-x86
  extra:
    !!merge <<:
      - *akmods-base
      - *akmods-extra
      - *arch-only-x86
  nvidia-lts:
    !!merge <<:
      - *akmods-base
      - *akmods-nvidia-lts
      - *arch-only-x86
  nvidia-open:
    !!merge <<:
      - *akmods-base
      - *akmods-nvidia-open
      - *arch-only-x86

desktop-build-group: &desktop-build-group
  common:
    !!merge <<:
      - *akmods-base
      - *akmods-common
      - *arch-arm-x86
  nvidia-lts:
    !!merge <<:
      - *akmods-base
      - *akmods-nvidia-lts
      - *arch-arm-x86
  nvidia-open:
    !!merge <<:
      - *akmods-base
      - *akmods-nvidia-open
      - *arch-arm-x86

server-build-group-only-x86: &server-build-group-only-x86
  nvidia-lts:
    !!merge <<:
      - *akmods-base
      - *akmods-nvidia-lts
      - *arch-only-x86
  nvidia-open:
    !!merge <<:
      - *akmods-base
      - *akmods-nvidia-open
      - *arch-only-x86
  zfs:
    !!merge <<:
      - *akmods-base
      - *akmods-zfs
      - *arch-only-x86

server-build-group: &server-build-group
  nvidia-lts:
    !!merge <<:
      - *akmods-base
      - *akmods-nvidia-lts
      - *arch-arm-x86
  nvidia-open:
    !!merge <<:
      - *akmods-base
      - *akmods-nvidia-open
      - *arch-arm-x86
  zfs:
    !!merge <<:
      - *akmods-base
      - *akmods-zfs
      - *arch-arm-x86

images:
  10:
    centos:
      !!merge <<:
        - *server-build-group
  43:
    main:
      # Fork customization: upstream builds no zfs akmod for `main`. This fork
      # publishes one so zfs-aurora-complex can consume a ready-made cache image
      # instead of rebuilding it from this repo's source on every run.
      !!merge <<:
        - *desktop-build-group-only-x86
        - *server-build-group-only-x86
    ogc:
      !!merge <<:
        - *ogc-desktop-build-group-only-x86
    coreos-stable:
      !!merge <<:
        - *desktop-build-group
        - *server-build-group
  44:
    main:
      # Fork customization: see the note on 43.main above.
      !!merge <<:
        - *desktop-build-group-only-x86
        - *server-build-group-only-x86
    ogc:
      !!merge <<:
        - *ogc-desktop-build-group-only-x86
    coreos-stable:
      !!merge <<:
        - *desktop-build-group
        - *server-build-group
    coreos-testing:
      !!merge <<:
        - *desktop-build-group
        - *server-build-group
    "longterm-6.18":
      !!merge <<:
        - *server-build-group
