name: Nightly compliance

# Runs the repository's contract checks every night against main, so drift in
# the outside world (new runner image, new shellcheck, an upstream merge that
# silently reverted a patch) is noticed without a pull request:
#   - bats unit tests (tests/unit, when present)
#   - node --test (scripts/tests, .claude/hooks/tests)
#   - shellcheck on every tracked shell file (errors only: upstream-owned
#     scripts carry warnings this fork does not rewrite)
#   - actionlint on every workflow
#   - scripts/check-policies.mjs (when present)
#   - generate-workflows drift: the build-akmods-*.yml set must match the
#     flavors and versions in images.yaml (a full `just generate-workflows`
#     rewrites cron minutes with $RANDOM and needs podman, so only the shape
#     is compared)
#
# On a scheduled or manual run on main the `report` job keeps ONE tracking
# issue: it opens or comments on it when any check failed, and closes it when
# every check passes again. Nothing here builds or publishes an image.
#
# Flaky checks: the bats, node and policy steps retry up to
# `workflows["nightly-compliance.yml"].retries` times (default 0), a value the
# weekly Auto-QA workflow proposes changes to; see .github/auto-qa-tuning.json.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-compliance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (bats)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run bats unit tests
        run: |
          set -euo pipefail
          if [ ! -d tests/unit ]; then
            echo "::notice::tests/unit not present; nothing to run"
            exit 0
          fi
          retries=$(jq -r '.workflows["nightly-compliance.yml"].retries // 0' .github/auto-qa-tuning.json)
          attempt=0
          until npx --yes bats@1.11.1 --tap tests/unit; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$retries" ]; then exit 1; fi
            echo "::warning::bats failed; retry $attempt of $retries"
          done

  node:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: node --test
        run: |
          set -euo pipefail
          retries=$(jq -r '.workflows["nightly-compliance.yml"].retries // 0' .github/auto-qa-tuning.json)
          attempt=0
          until node --test; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$retries" ]; then exit 1; fi
            echo "::warning::node --test failed; retry $attempt of $retries"
          done

  shellcheck:
    name: Lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: shellcheck (errors only)
        run: |
          shellcheck --version
          git ls-files -z '*.sh' '*.bash' '*.bats' | xargs -0 shellcheck --severity=error

  actionlint:
    name: Lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint v1.7.12 (checksum-verified)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint

      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

  policies:
    name: Policy check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: node scripts/check-policies.mjs
        run: |
          set -euo pipefail
          if [ ! -f scripts/check-policies.mjs ]; then
            echo "::notice::scripts/check-policies.mjs not present; nothing to run"
            exit 0
          fi
          retries=$(jq -r '.workflows["nightly-compliance.yml"].retries // 0' .github/auto-qa-tuning.json)
          attempt=0
          until node scripts/check-policies.mjs; do
            attempt=$((attempt + 1))
            if [ "$attempt" -gt "$retries" ]; then exit 1; fi
            echo "::warning::check-policies failed; retry $attempt of $retries"
          done

  workflow-drift:
    name: Generated workflow drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare images.yaml with build-akmods-*.yml
        run: |
          set -euo pipefail
          # mikefarah yq is preinstalled on ubuntu-latest; the flag matches the Justfile.
          Y='yq --yaml-fix-merge-anchor-to-spec'
          rc=0
          expected=()
          for flavor in $($Y '.images.* | keys | .[]' images.yaml | sort -u); do
            file=".github/workflows/build-akmods-${flavor}.yml"
            expected+=("$file")
            if [ ! -f "$file" ]; then
              echo "FAIL missing $file for flavor $flavor (run 'just generate-workflows')"
              rc=1
              continue
            fi
            for version in $($Y '.images | to_entries | .[] | select(.value | has("'"$flavor"'")) | .key' images.yaml); do
              clean=${flavor//./-}
              if ! grep -q "cache_kernel_${clean}_${version}:" "$file"; then
                echo "FAIL $file has no cache_kernel job for $flavor $version"
                rc=1
              fi
            done
            echo "ok   $file"
          done
          # Generated workflows carry a fixed header; any build-akmods file
          # that is not in the expected set is stale output of a removed flavor.
          for f in .github/workflows/build-akmods-*.yml; do
            if [[ ! " ${expected[*]} " == *" $f "* ]]; then
              echo "FAIL $f matches no flavor in images.yaml (stale generated workflow)"
              rc=1
            fi
          done
          exit "$rc"

  report:
    name: Open, update or close the tracking issue
    needs: [unit, node, shellcheck, actionlint, policies, workflow-drift]
    if: ${{ always() && github.ref == 'refs/heads/main' && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TITLE: 'Nightly compliance failing'
          UNIT: ${{ needs.unit.result }}
          NODE: ${{ needs.node.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          ACTIONLINT: ${{ needs.actionlint.result }}
          POLICIES: ${{ needs.policies.result }}
          DRIFT: ${{ needs.workflow-drift.result }}
        run: |
          set -euo pipefail
          # List rather than search: the search index lags, and `in:title` is
          # a word match. Match the exact title AND the Actions bot as author,
          # so an issue anyone else opens with this title is never reused.
          existing=$(gh issue list --repo "$GH_REPO" --state open --limit 1000 --json number,title,author \
            --jq '[.[] | select(.title == env.TITLE and (.author.login == "app/github-actions" or .author.login == "github-actions[bot]" or .author.login == "github-actions"))][0].number // empty')
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          failed=""
          for pair in "bats unit tests:$UNIT" "node --test:$NODE" "shellcheck:$SHELLCHECK" "actionlint:$ACTIONLINT" "policy check:$POLICIES" "workflow drift:$DRIFT"; do
            [ "${pair#*:}" = "success" ] || failed="$failed ${pair%%:*} (${pair#*:});"
          done
          if [ -z "$failed" ]; then
            if [ -n "$existing" ]; then
              gh issue close --repo "$GH_REPO" "$existing" --comment "Nightly compliance is green again ($run_url). Closing."
            fi
            echo "All nightly checks passed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body=$(printf 'The nightly compliance run failed on %s.\n\nChecks that did not pass:%s\n\nRun: %s\n\nThis issue closes itself when a nightly run passes every check.\n' \
            "$(date -u +%Y-%m-%d)" "$failed" "$run_url")
          if [ -n "$existing" ]; then
            gh issue comment --repo "$GH_REPO" "$existing" --body "$body"
          else
            gh label create nightly-compliance --repo "$GH_REPO" --color d93f0b \
              --description 'Opened by the Nightly compliance workflow' 2>/dev/null || true
            gh issue create --repo "$GH_REPO" --title "$TITLE" --label nightly-compliance --label bug --body "$body"
          fi
