name: Coverage gate

# Fails a pull request or a push to main when the share of testable
# FORK-PATCHES.md entries that carry a bats test (or the bats test count) drops
# below the floors in .coverage-thresholds.json. See scripts/coverage-gate.mjs
# for why this repo gates on patch coverage rather than kcov line coverage.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: coverage-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Compare against floors
        run: |
          set -o pipefail
          node scripts/coverage-gate.mjs | tee gate.txt

      - name: Publish table
        if: always()
        run: |
          if [ -f gate.txt ]; then
            { cat gate.txt; echo; } >> "$GITHUB_STEP_SUMMARY"
          fi
