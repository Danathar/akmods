# AI fix requested. Human-triggered, never automatic. It runs only when a
# maintainer explicitly asks, by applying the `ai-fix-requested` label to an
# issue or pull request, or by commenting `/ai-fix` on one. It then runs the
# Claude Code GitHub Action (the same one claude.yml uses) in agent mode:
#   - on an ISSUE it attempts a fix on a new branch and opens a PR against
#     Danathar/akmods `main`;
#   - on a PULL REQUEST it reads the review findings and applies the ones that
#     hold up to the PR's head branch (this is the automated review-application
#     path). Findings that are wrong or not actionable are reported, not forced.
#
# Why not automatic: review findings need checking before they are applied;
# automated findings are sometimes factually wrong or correct but not
# actionable (they need a merge order, not a code change). Verification is the
# value, so a person asks for it.
#
# Gating:
#   - Events sent by a bot are skipped before any step runs. A GitHub App that
#     files issues with `ai-fix-requested` would otherwise produce a red run:
#     the collaborator API answers `none` for an app. Skipping is grey.
#   - A `/ai-fix` comment from anyone but OWNER, MEMBER or COLLABORATOR is
#     skipped the same way. Only someone with triage access can label, so the
#     label path needs no association test; the permission check below is the
#     real control either way.
#   - For a PR, only a same-repository head branch is accepted. A fork PR
#     (`isCrossRepository`) or a closed PR is refused with a comment, because
#     this job holds a write token and an Anthropic credential and must not
#     check out untrusted fork code.
#   - With neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN set, the job
#     acknowledges, writes a step summary about the missing secret, and skips
#     the agent. It does not fail red. Set exactly one of the two.
#
# No `pull_request_target`: paired with write permissions it is the classic
# privilege-escalation shape. `issue_comment` also fires on PRs, so `/ai-fix`
# reaches a PR without it. The `pull_request: labeled` trigger gets a read-only
# token for fork PRs, and the same-repository test below skips them.
#
# The allowlist is a speed bump, not a sandbox (see claude.yml for the full
# threat model). Pushes made with GITHUB_TOKEN do not start CI; the agent's
# closing comment asks the maintainer to re-run checks.
#
# Rules for the agent are in AGENTS.md and FORK-PATCHES.md. Upstream
# (ublue-os/akmods) is read-only: every gh write passes `--repo Danathar/akmods`.

name: AI fix requested

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ai-fix-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  requested:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    if: >-
      github.event.sender.type != 'Bot' && (
        (
          github.event_name == 'issues' &&
          github.event.label.name == 'ai-fix-requested'
        ) || (
          github.event_name == 'pull_request' &&
          github.event.label.name == 'ai-fix-requested' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) || (
          github.event_name == 'issue_comment' &&
          startsWith(github.event.comment.body, '/ai-fix') && (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check requester is a maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          role=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" \
                   --jq '.permission' 2>/dev/null || echo none)
          case "$role" in
            admin|maintain|write) echo "$ACTOR has $role; proceeding" ;;
            *) echo "::error::$ACTOR lacks write access (got '$role'); refusing."; exit 1 ;;
          esac

      - name: Resolve target and refuse fork or closed PRs
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event_name == 'pull_request' || github.event.issue.pull_request != null }}
        run: |
          ref=""
          proceed=true
          if [ "$IS_PR" = "true" ]; then
            read -r cross state head < <(gh pr view "$NUM" --repo "$GH_REPO" \
              --json isCrossRepository,state,headRefName \
              --jq '[.isCrossRepository, .state, .headRefName] | @tsv')
            if [ "$cross" = "true" ]; then
              proceed=false
              reason="PR #$NUM comes from a fork. AI fix only works on same-repository branches."
            elif [ "$state" != "OPEN" ]; then
              proceed=false
              reason="PR #$NUM is $state; nothing to fix."
            else
              ref="$head"
            fi
          fi
          if [ "$proceed" = "false" ]; then
            gh issue comment "$NUM" --repo "$GH_REPO" --body "AI fix refused: $reason"
            {
              echo "## AI fix refused"
              echo
              echo "$reason"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "proceed=$proceed"
            echo "ref=$ref"
            echo "is_pr=$IS_PR"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.target.outputs.proceed == 'true'
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Acknowledge the request
        if: steps.target.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh issue comment "$NUM" --repo "$GH_REPO" --body "$(printf 'AI fix requested by @%s ([run](%s/%s/actions/runs/%s)).\n\nBefore applying anything, the agent reads %s and %s. It verifies each finding against the code first, and reports findings it rejects instead of forcing a change.\n' \
            "$GITHUB_ACTOR" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" 'AGENTS.md' 'docs/review-rubric.md')"

      - name: Detect Anthropic credential
        id: auth
        if: steps.target.outputs.proceed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## AI fix requested"
              echo
              echo "Gating and acknowledgement ran. The agent step was skipped"
              echo "because this repository has no Anthropic credential."
              echo
              echo "To enable it, add one repository secret:"
              echo "- \`ANTHROPIC_API_KEY\` (API billing), or"
              echo "- \`CLAUDE_CODE_OAUTH_TOKEN\` (from \`claude setup-token\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Read-only helper for the agent. `gh api` is not allowlisted directly:
      # a prefix rule would also approve `-X PUT .../merge`, and adding fields
      # flips gh to POST. This script hardcodes the method and repository and
      # accepts only a fixed kind plus a numeric id, so there is nothing to inject.
      - name: Install read-only review fetcher
        if: steps.target.outputs.proceed == 'true' && steps.auth.outputs.configured == 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/gh-review-read.sh" <<'SCRIPT'
          #!/bin/bash
          # usage: gh-review-read.sh <pr-comments|pr-reviews|issue-comments> <number>
          set -euo pipefail
          kind="${1:-}"
          num="${2:-}"
          [[ "$num" =~ ^[0-9]+$ ]] || { echo "number must be digits" >&2; exit 2; }
          case "$kind" in
            pr-comments) path="pulls/$num/comments" ;;
            pr-reviews) path="pulls/$num/reviews" ;;
            issue-comments) path="issues/$num/comments" ;;
            *) echo "kind must be pr-comments, pr-reviews or issue-comments" >&2; exit 2 ;;
          esac
          exec gh api --method GET --paginate "repos/Danathar/akmods/$path"
          SCRIPT
          sed -i 's/^          //' "$RUNNER_TEMP/gh-review-read.sh"
          chmod 0755 "$RUNNER_TEMP/gh-review-read.sh"

      # anthropics/claude-code-action v1.0.248 (annotated tag dereferenced to
      # its commit). A `prompt` runs the action in agent mode, so no @claude
      # mention is needed.
      - name: Apply the fix
        if: steps.target.outputs.proceed == 'true' && steps.auth.outputs.configured == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            A maintainer asked for an AI fix on ${{ github.repository }}#${{ github.event.issue.number || github.event.pull_request.number }} (pull request: ${{ steps.target.outputs.is_pr }}).

            Read AGENTS.md and FORK-PATCHES.md first. Danathar/akmods is a fork of ublue-os/akmods: ublue-os/akmods is READ-ONLY, so never open a PR, issue or comment against it and pass --repo Danathar/akmods to every gh write command. Keep changes fork-local and minimal so upstream merges stay mechanical; do not edit upstream-owned files (Justfile, build_files/, images.yaml, existing build workflows) unless the task requires it, and say so if you do. Never run just build, just test, just fetch-kernel, just push, podman, sudo or dnf: builds run only in GitHub Actions. Never touch certs/private_key*.priv or signing material, and never weaken the OpenZFS signature and checksum verification in build_files/zfs/build-kmod-zfs.sh. Before committing run the checks that apply: npx --yes bats@1.11.1 tests/unit, node --test, shellcheck on changed shell files. See FORK-PATCHES.md for the fork's load-bearing patches.

            1. Read the issue or PR with `gh issue view` or `gh pr view`, using --repo Danathar/akmods. `gh pr view` does not return inline review comments; fetch them with `${{ runner.temp }}/gh-review-read.sh pr-comments <number>` (inline comments) and `${{ runner.temp }}/gh-review-read.sh pr-reviews <number>` (review summaries). That script is read-only; do not call `gh api` directly.
            2. For each finding or requirement, verify the claim against the code at this checkout. Judge review findings by docs/review-rubric.md when it exists. Skip, and say why, any finding that is wrong, not actionable, or needs a merge order instead of a code change.
            3. For a pull request, commit the fixes to the checked-out head branch and push with exactly `git push -u origin HEAD` (no other push form is permitted). For an issue, create a branch from main with `git switch -c <branch>`, push with exactly `git push -u origin HEAD`, then open a PR with `gh pr create --repo Danathar/akmods --base main --head <branch>`.
            4. Run the checks that apply to what you changed (bats unit tests, node --test, shellcheck) before committing. Do not merge anything.
            5. Finish with one comment (`gh issue comment --repo Danathar/akmods` or `gh pr comment --repo Danathar/akmods`) listing which findings you applied and which you rejected, with the reason for each. Pushes and PRs made with the workflow token do not start CI, so if you pushed or opened a PR, end the comment by telling the maintainer to re-run the checks (close and reopen the PR, or push an empty commit).
          claude_args: >-
            --max-turns 40
            --append-system-prompt "Work only on Danathar/akmods. Danathar/akmods is a fork of ublue-os/akmods: ublue-os/akmods is READ-ONLY, so never open a PR, issue or comment against it and pass --repo Danathar/akmods to every gh write command. Keep changes fork-local and minimal so upstream merges stay mechanical; do not edit upstream-owned files (Justfile, build_files/, images.yaml, existing build workflows) unless the task requires it, and say so if you do. Never run just build, just test, just fetch-kernel, just push, podman, sudo or dnf: builds run only in GitHub Actions. Never touch certs/private_key*.priv or signing material, and never weaken the OpenZFS signature and checksum verification in build_files/zfs/build-kmod-zfs.sh. Before committing run the checks that apply: npx --yes bats@1.11.1 tests/unit, node --test, shellcheck on changed shell files. See FORK-PATCHES.md for the fork's load-bearing patches."
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git switch:*),Bash(git push origin HEAD),Bash(git push -u origin HEAD),Bash(gh pr create --repo Danathar/akmods:*),Bash(gh pr view --repo Danathar/akmods:*),Bash(gh pr comment --repo Danathar/akmods:*),Bash(gh issue view --repo Danathar/akmods:*),Bash(gh issue comment --repo Danathar/akmods:*),Bash(${{ runner.temp }}/gh-review-read.sh:*),Bash(npx --yes bats@1.11.1 tests/unit:*),Bash(shellcheck:*),Bash(bash -n:*),Bash(node --test:*)"
