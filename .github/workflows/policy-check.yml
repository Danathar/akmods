name: Policy check

# Runs scripts/check-policies.mjs (the machine-checked rules in policies/ and
# the docs/risk-tiers.md vs risk-config.json drift check), then the checker's
# own tests. Node built-ins only, so there is no npm install.
# See policies/README.md. No path filter: policy-check is a required check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: policy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-check:
    name: policy-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Check policies
        run: node scripts/check-policies.mjs

      - name: Test the policy checker
        run: node --test scripts/tests/check-policies.test.mjs
