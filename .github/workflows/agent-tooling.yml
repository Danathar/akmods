name: Agent tooling

# Runs the dependency-free Node built-in tests (`node --test` discovers every
# **/*.test.mjs from the repo root): the Claude Code hooks under .claude/hooks/
# tests and the helper scripts under scripts/tests. Other slices add test files
# without touching this workflow. No path filter, so the check always reports.
#
# The `mutation` job is advisory (#192) and never a required check: on a pull
# request it mutates the changed lines of .claude/hooks/*.mjs and scripts/*.mjs
# with a pinned StrykerJS installed outside the checkout (the repository keeps
# no package.json) and lists every mutant no test notices. See docs/quality.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: agent-tooling-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-tests:
    name: Agent tooling (node --test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run node tests
        run: node --test

  mutation:
    name: Mutation check on changed lines (advisory)
    if: "github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'chore: sync upstream')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Stryker (pinned, not saved)
        run: npm install --prefix "$RUNNER_TEMP/stryker" --no-save --ignore-scripts --no-audit --no-fund @stryker-mutator/core@10.0.0

      - name: Mutate changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        # The budget ends the run on its own well before timeout-minutes, which
        # stays as a backstop: a job cut off by its timeout reports `cancelled`,
        # and that blocks the merge even with continue-on-error (#216).
        run: node scripts/mutation-check.mjs --base "origin/$BASE_REF" --stryker "$RUNNER_TEMP/stryker/node_modules/.bin/stryker" --budget-minutes 35
